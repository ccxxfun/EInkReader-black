apply plugin: 'com.android.application'

android {
    namespace "com.einkreader"
    compileSdkVersion 35
    
    defaultConfig {
        applicationId "com.einkreader.black"
        minSdkVersion 19
        targetSdkVersion 19
        versionCode 14
        versionName "1.1.9"
    }

    // 固定签名：保证每次构建 APK 签名一致，可覆盖安装
    signingConfigs {
        common {
            storeFile file("../einkreader-black.keystore")
            storePassword "einkreader123"
            keyAlias "einkreader"
            keyPassword "einkreader123"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.common
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.common
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // ZXing 二维码生成库
    implementation 'com.google.zxing:core:3.5.3'
}
