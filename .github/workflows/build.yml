name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: echo "version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> $GITHUB_OUTPUT

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk EInkReader-v${{ steps.ver.outputs.version }}-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EInkReader-debug-apk
          path: EInkReader-v*.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: EInkReader-v*.apk
          make_latest: true
